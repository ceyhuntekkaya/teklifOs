server:
  port: 8084

spring:
  application:
    name: rfq-service
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/rfq_db
    username: ${DB_USER:rfq_svc}
    password: ${DB_PASSWORD:rfq_svc_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:teklifos}
    password: ${RABBITMQ_PASSWORD:teklifos_dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

teklifos:
  internal:
    api-key: ${TEKLIFOS_INTERNAL_API_KEY:dev-internal-key}
  master-data:
    base-url: ${MASTER_DATA_SERVICE_URL:http://localhost:8082}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:teklifos}
    secret-key: ${MINIO_ROOT_PASSWORD:teklifos_dev_minio}
    bucket: ${MINIO_BUCKET:teklifos}
    secure: false

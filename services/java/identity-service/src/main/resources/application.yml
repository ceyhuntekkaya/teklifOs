server:
  port: 8081

spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/identity_db
    username: ${DB_USER:identity_svc}
    password: ${DB_PASSWORD:identity_svc_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:teklifos}
    password: ${RABBITMQ_PASSWORD:teklifos_dev}

teklifos:
  jwt:
    issuer: ${JWT_ISSUER:https://teklifos.local}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/dev-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/dev-public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

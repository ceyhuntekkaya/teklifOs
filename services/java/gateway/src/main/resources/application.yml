server:
  port: 8080

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - ${CORS_ORIGIN:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/tenants/**,/api/v1/invitations/**,/api/v1/api-keys/**,/api/v1/audit/**,/.well-known/**
            - id: master-data
              uri: ${MASTER_DATA_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**,/api/v1/customers/**,/api/v1/manufacturers/**,/api/v1/imports/**,/api/v1/units/**
            - id: pricing
              uri: ${PRICING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/pricing/**,/api/v1/price-lists/**,/api/v1/pricing-rules/**
            - id: rfq
              uri: ${RFQ_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/rfqs/**
            - id: quote
              uri: ${QUOTE_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/quotes/**,/api/v1/approvals/**,/api/v1/quote-templates/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/outbound-messages/**,/api/v1/follow-ups/**,/api/v1/email-templates/**
            - id: mail-ingestion
              uri: ${MAIL_INGESTION_URL:http://localhost:9001}
            predicates:
                - Path=/api/v1/mailboxes/**,/api/v1/inbound/**
            - id: reports
              uri: ${RFQ_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

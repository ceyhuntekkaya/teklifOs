[project]
name = "pdf-render-service"
version = "0.1.0"
description = "Quote PDF rendering service"
requires-python = ">=3.13"
dependencies = [
    "teklifos-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
pdf-render-service = "pdf_render_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_render_service"]

[tool.uv.sources]
teklifos-shared = { workspace = true }

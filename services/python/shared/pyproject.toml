[project]
name = "teklifos-shared"
version = "0.1.0"
description = "Shared utilities for TeklifOS Python services"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "boto3>=1.36.0",
    "pika>=1.3.0",
    "starlette>=0.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teklifos_shared"]

[project]
name = "ocr-service"
version = "0.1.0"
description = "OCR processing service"
requires-python = ">=3.13"
dependencies = [
    "teklifos-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ocr-service = "ocr_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocr_service"]

[tool.uv.sources]
teklifos-shared = { workspace = true }

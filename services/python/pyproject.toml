[project]
name = "teklifos-python"
version = "0.1.0"
description = "TeklifOS Python microservices workspace"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "shared",
    "mail-ingestion-service",
    "document-service",
    "ocr-service",
    "ai-service",
    "pdf-render-service",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

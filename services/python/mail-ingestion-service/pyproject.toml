[project]
name = "mail-ingestion-service"
version = "0.1.0"
description = "Mailbox ingestion service"
requires-python = ">=3.13"
dependencies = [
    "teklifos-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "email-validator>=2.2.0",
]

[project.scripts]
mail-ingestion-service = "mail_ingestion_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_ingestion_service"]

[tool.uv.sources]
teklifos-shared = { workspace = true }

[project]
name = "document-service"
version = "0.1.0"
description = "Document upload and validation service"
requires-python = ">=3.13"
dependencies = [
    "teklifos-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
document-service = "document_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["document_service"]

[tool.uv.sources]
teklifos-shared = { workspace = true }

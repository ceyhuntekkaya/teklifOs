[project]
name = "ai-service"
version = "0.1.0"
description = "AI extraction and LLM gateway service"
requires-python = ">=3.13"
dependencies = [
    "teklifos-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ai-service = "ai_service.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service"]

[tool.uv.sources]
teklifos-shared = { workspace = true }

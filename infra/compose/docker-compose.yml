services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: teklifos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teklifos_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teklifos"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-teklifos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-teklifos_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teklifos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-teklifos_dev_minio}
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - gateway

  gateway:
    build:
      context: ../../services/java
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      REDIS_HOST: valkey
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MASTER_DATA_SERVICE_URL: http://master-data-service:8082
      PRICING_SERVICE_URL: http://pricing-service:8083
      RFQ_SERVICE_URL: http://rfq-service:8084
      QUOTE_SERVICE_URL: http://quote-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      MAIL_INGESTION_URL: http://mail-ingestion:9001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  grafana_data:
